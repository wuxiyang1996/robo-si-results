name: Publish reviewed gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - name: Build the research site and historical links
        run: |
          python3 tools/build_site.py
          python3 tools/check_site.py --root dist
          node --check site/assets/site.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the research site
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # deploy-pages caps its polling timeout at 10 minutes.
          timeout: 600000
